[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpcodeagent"
version = "0.1.0"
description = "A compact, replayable coding-agent harness in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "python-dotenv>=1.0", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
cpcodeagent = "cpcodeagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cpcodeagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
